<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 16 - Cypress</title>
</head>
<body>
    <h1>Programa de saudações</h1>
    <p>Digite seu nome e clique em enviar</p>
    <form id="Formulário">
        <label for="name-input">Nome:</label>
        <input type="text" id="name-input" nome="nome" data-cy="nome">
        <button data-cy="enviar">Enviar</button>
    </form>
    <p id="resposta" data-cy="resposta"></p>

    <script src="script.js"></script>
</body>
</html>
