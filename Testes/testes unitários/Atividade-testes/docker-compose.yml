services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: escola_caos
      MYSQL_USER: diretor
      MYSQL_PASSWORD: devpass
    ports:
      - "3307:3306"
    volumes:
      - dados:/var/lib/mysql
      - ./regras-db.sql:/docker-entrypoint-initdb.d/regras-db.sql:ro

volumes:
  dados:
